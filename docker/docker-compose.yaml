
services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: rag_tools_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag_tools}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_tools_password}
      POSTGRES_DB: ${POSTGRES_DB:-rag_tools}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_tools}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag_tools_network

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_tools_qdrant
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__SERVICE__HTTP_PORT: 6333
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag_tools_network

  # Optional: pgAdmin for PostgreSQL management
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: rag_tools_pgadmin
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@ragtools.local}
  #     PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
  #   ports:
  #     - "${PGADMIN_PORT:-5050}:80"
  #   depends_on:
  #     - postgres
  #   profiles:
  #     - admin
  #   networks:
  #     - rag_tools_network

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local

networks:
  rag_tools_network:
    driver: bridge
